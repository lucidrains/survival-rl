[project]
name = "survival-rl"
version = "0.0.8"
description = "Explorations into Survival Reinforcement Learning"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'reinforcement learning',
    'survival analysis'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einx>=0.4.3",
    "einops>=0.8.2",
    "torch>=2.5",
    "x-mlps-pytorch>=0.6.4",
    "torch-einops-utils>=0.1.31"
]

[project.urls]
Homepage = "https://pypi.org/project/survival-rl/"
Repository = "https://github.com/lucidrains/survival-rl"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["survival_rl"]

[tool.hatch.build.targets.sdist]
include = [
    "/survival_rl",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE"
]
